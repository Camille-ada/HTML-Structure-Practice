<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Dom Practice</title>
</head>

<body>
    
    // click counter
    <section>
        <h2>Click Counter</h2>
        <button id="counter-btn">Click me</button>
        <p>Count: <span id="counter-value">0</span></p>
    </section>

    // text toggler
    <section>
        <h2> Text toggler</h2>
        <button id="toggle-btn">Toggle me! </button>
        <p id="toggle-text">Hello, is anyone home?</p>
    </section>

    // live input echo
    <section>
        <h2>Live Input Echo</h2>
        <input type="text" id="textBox" placeholder="Type here!">
        <p id="output"></p>
    </section>
    
    <section>
        <h2>Dynamic List</h2>
        <input type="text" id="list-input" placeholder="New item...">
        <button id="list-add-btn">Add</button>
        <ul id="item-list">
            <li>Example item</li>
        </ul>
    </section>
 
    <script src="script.js"></script>

</body>
</html>
